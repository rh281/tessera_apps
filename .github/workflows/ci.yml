name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow (release.yml) runs this whole check before it builds anything.
  workflow_call:

concurrency:
  # github.workflow is the caller's name when release.yml calls this file, so a release's check never
  # shares a group with (and never cancels, or is cancelled by) a push or pull request run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Must match the classifiers in pyproject.toml.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install -p .venv -r requirements-lock.txt
          uv pip install -p .venv --no-deps -e .
      - name: Lockfile is current
        if: matrix.python == '3.12'
        run: |
          # Starting from the committed lock keeps existing pins, so this fails only when pyproject.toml
          # and the lock disagree, not whenever a dependency publishes a release.
          cp requirements-lock.txt /tmp/lock.txt
          uv pip compile pyproject.toml --all-extras --python-version 3.12 --no-header -q -o /tmp/lock.txt
          diff requirements-lock.txt /tmp/lock.txt
      - name: ruff
        run: .venv/bin/ruff check src tests scripts demo && .venv/bin/ruff format --check src tests scripts demo
      - name: mypy
        # demo/app.py imports Streamlit, which the lock does not hold, so mypy reads those imports as
        # untyped (mypy.ini ignores missing imports) and checks the rest of the page.
        run: .venv/bin/mypy src tests scripts demo
      - name: pytest (offline)
        run: .venv/bin/python -m pytest -q
